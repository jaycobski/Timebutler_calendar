server {
    listen 80;
    server_name localhost;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API routes with rate limiting
    location /v1/ {
        limit_req zone=api burst=200 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Load testing headers
        proxy_set_header X-Load-Test "true";
        proxy_set_header X-Request-Start $msec;

        # Timeouts for load testing
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;

        # Keep connections alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Frontend routes
    location / {
        limit_req zone=general burst=100 nodelay;

        # Simulate frontend response for load testing
        return 200 '<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeButler Calendar - Load Test</title>
</head>
<body>
    <h1>TimeButler Calendar MVP</h1>
    <p>German Holiday Bridge Weekend Optimizer - Load Testing Mode</p>
    <div>Feiertag, Holiday, Bayern, Berlin, Weihnachten, Christmas</div>
</body>
</html>';
        add_header Content-Type text/html;
        add_header X-Load-Test "frontend";
    }

    # Metrics endpoint for monitoring
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 172.20.0.0/16;
        deny all;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}